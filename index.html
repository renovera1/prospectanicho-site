<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProspectaNicho - versoes</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #fff;
        background: #061e3a;
        font-family: Arial, sans-serif;
      }

      main {
        width: 100%;
        max-width: 760px;
        display: grid;
        gap: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4rem);
      }

      p {
        margin: 0;
        color: #c9d8e8;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .links {
        display: grid;
        gap: 12px;
      }

      a {
        display: block;
        border: 1px solid rgba(191, 245, 238, 0.28);
        border-radius: 8px;
        padding: 18px 20px;
        color: #fff;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.08);
      }

      a:hover {
        border-color: #38ddd5;
        background: rgba(56, 221, 213, 0.14);
      }

      strong {
        display: block;
        margin-bottom: 4px;
        color: #bff5ee;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ProspectaNicho</h1>
      <p>Escolha qual versao publica deseja abrir.</p>
      <div class="links">
        <a href="/prospecta-nicho/versao-anterior/">
          <strong>Versao anterior</strong>
          Site restaurado antes do showcase.
        </a>
        <a href="/prospecta-nicho/versao-showcase/">
          <strong>Versao showcase</strong>
          Primeira dobra premium em Gallery Grid / Curated Showcase.
        </a>
      </div>
    </main>
  </body>
</html>
